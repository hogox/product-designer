id: onboarding-empresas
title: Reducir el tiempo de activación en cuentas empresariales
product: Onboarding B2B
description: Las cuentas empresariales tardan en promedio 14.2 días en completar
  la activación inicial, duplicando el target de 7 días y generando fricción temprana
  en clientes de alto valor.
archived: false
version: 2
status: approved
current_stage: exploracion
problem_statement: Las cuentas empresariales tardan en promedio 14.2 días en activarse
  por primera vez (objetivo ≤7 días). El 41.6% de las cuentas nunca completa la
  configuración de equipo, y el 67% de los tickets de soporte en los primeros 30
  días son sobre permisos y roles. Los administradores no comprenden la diferencia
  entre roles, la importación de datos desde CSV es propensa a errores sin validación
  en tiempo real, y no existe indicador de progreso de la configuración. Las cuentas
  que completan la configuración de equipo en ≤3 días tienen un 89% de retención
  a 6 meses, frente al 71% general.
outcomes:
  - metric: Tiempo promedio hasta primera activación (cuentas empresariales)
    baseline: 14.2 días (n=89 cuentas, Q1 2026)
    target: "≤7 días"
    method: Tiempo entre creación de cuenta y primer inicio de sesión de cualquier
      miembro del equipo distinto al admin
    heart: task_success
    signals:
      - Primer login de usuario no-admin
      - Primer workspace colaborativo creado
      - Primera importación de datos completada
  - metric: Tasa de completitud de configuración de equipo
    baseline: 58.4% (52 de 89 cuentas completan la configuración de equipo)
    target: "≥85%"
    method: Cuentas que invitan y confirman ≥2 miembros de equipo en los primeros
      7 días / total de cuentas nuevas
    heart: adoption
    signals:
      - Invitaciones enviadas y aceptadas
      - Miembros que completan onboarding
      - Roles correctamente asignados
  - metric: Tickets de soporte sobre permisos/roles en primeros 30 días
    baseline: 67% de los tickets (295/439) son sobre permisos y roles
    target: "≤25% de los tickets sobre permisos/roles"
    method: Categorización de tickets por tema en los primeros 30 días de vida de
      la cuenta
    heart: happiness
    signals:
      - Tickets etiquetados como 'permisos' o 'roles'
      - Tiempo hasta resolución de tickets de permisos
      - Reaperturas de tickets de permisos
  - metric: Retención a 6 meses de cuentas empresariales
    baseline: 71% (cuentas activadas en Q3 2025)
    target: "≥85% (paridad con cuentas que activan equipo en ≤3 días)"
    method: "Cohortes por cuatrimestre: cuentas que siguen activas a los 6 meses
      / cuentas creadas"
    heart: retention
    signals:
      - Renovaciones de contrato anual
      - Uso activo mensual por cuenta
      - Net Revenue Retention por cohorte
scope:
  in_scope:
    - Wizard de configuración inicial de cuenta empresarial (5 pasos)
    - Clarificación visual de roles y permisos durante la configuración
    - Validación en tiempo real de importaciones de datos (CSV/Excel)
    - Indicador de progreso de activación de la cuenta
    - Sistema de invitaciones con recordatorios automáticos y confirmación visual
  non_goals:
    - Rediseñar el sistema de permisos en sí mismo (solo mejorar la documentación
      y UX de configuración)
    - "Integración con sistemas de directorio (LDAP, Active Directory) — evaluado
      para Q4"
    - Soporte para importación desde APIs de terceros (alcance separado)
    - Panel de administración de cuenta tras la activación inicial
constraints:
  regulatory:
    - "Las cuentas empresariales pueden tener datos sujetos a GDPR: la importación
      debe validar tipos de campos y advertir sobre datos personales"
  accessibility: WCAG 2.1 AA
  design_system:
    name: Design System Interno
    version: 2.4.1
    link: ""
  technical:
    - El wizard de configuración no puede modificar el esquema de base de datos de
      cuentas (solo API existente)
    - La validación de importaciones debe funcionar en el cliente (sin nueva lambda
      de procesamiento)
decisions:
  - id: DEC-001
    date: 2026-06-13
    decision: Priorizar la configuración de equipo y la importación de datos como
      los dos puntos de mayor fricción a resolver
    rationale: F-002 y F-003 muestran que la configuración de equipo incompleta (41.6%)
      y los errores de permisos (67% tickets) son los mayores bloqueadores. La importación
      de datos aparece como segunda causa de abandono del setup (F-005). Resolver
      estos dos puntos cubre el 80% de las causas raíz del lento tiempo de activación.
    author: Laura Martínez (Lead Designer)
    supersedes: null
tasks:
  - id: H-001
    description: Si guiamos al admin empresarial paso a paso en la configuración de
      roles y permisos con ejemplos visuales, entonces reduciremos los tickets de
      soporte sobre permisos (F-003, F-004).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si ofrecemos validación en tiempo real durante la importación de
      datos con preview y mensajes de error claros, entonces reduciremos los errores
      de importación y la frustración asociada (F-005).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si mostramos un indicador de progreso de activación con los pasos
      completados y pendientes, entonces el admin tendrá claridad sobre qué le falta
      para que la cuenta esté lista (F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si enviamos recordatorios automatizados a los invitados pendientes
      y confirmamos visualmente el estado de cada miembro, entonces aumentaremos la
      completitud del equipo en los primeros 7 días (F-007, F-008).
    stage: definicion
    owner: human
    status: todo
