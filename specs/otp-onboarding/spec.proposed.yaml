id: otp-onboarding
title: Reducir el abandono en la verificación OTP del onboarding
version: 1
status: in_review
current_stage: definicion
problem_statement: El 43.2% de los usuarios que llegan al paso de verificación
  OTP del onboarding lo abandonan sin completarlo, afectando por igual a
  usuarios nuevos y recurrentes. La demora en la llegada del código SMS y la
  falta de retroalimentación durante la espera generan incertidumbre,
  frustración y riesgo de pérdida de usuarios.
outcomes:
  - metric: "Tasa de abandono en el paso OTP (HEART: Task Success)"
    baseline: 43.2% (136/315)
    target: Reducir el abandono de forma significativa (target a definir por el humano)
    method: "Analítica de embudo: usuarios que abandonan / usuarios que llegan al
      paso OTP"
  - metric: Tasa de finalización de verificación OTP por segmento (Task Success)
    baseline: Abandono nuevos 42.9% (60/140); recurrentes 43.4% (76/175)
    target: Mejorar finalización en ambos segmentos sin disparidad (target tentativo)
    method: Analítica de embudo segmentada por nuevo vs. recurrente
  - metric: Tiempo de espera del código en sesiones que abandonan (Engagement/Latencia)
    baseline: 71.9 s promedio (n=136)
    target: Reducir el tiempo de espera percibido/real (target tentativo)
    method: Medición del tiempo entre solicitud y llegada/uso del código en abandonos
  - metric: Uso del botón de reenvío y satisfacción percibida durante la espera
      (Happiness)
    baseline: null
    target: Aumentar satisfacción y disponibilidad oportuna del reenvío (target
      tentativo)
    method: Encuesta in-app post-verificación y telemetría de activación del botón
      de reenvío
scope:
  in_scope:
    - Reducir o comunicar la demora en la llegada del código OTP por SMS
    - "Mostrar retroalimentación clara en pantalla: confirmación de envío,
      número de destino enmascarado y contador de tiempo"
    - Ajustar la lógica de activación del botón de reenviar para que esté
      disponible de forma más oportuna
    - Explorar la experiencia de espera para nuevos y recurrentes por igual
  non_goals:
    - Implementar métodos de verificación alternativos (p. ej. huella digital)
      como solución principal en esta iteración
    - Rediseñar el onboarding completo más allá del paso de verificación OTP
    - Cambiar el proveedor de envío de SMS sin evidencia adicional
constraints:
  regulatory: []
  accessibility: ""
  design_system:
    name: ""
    version: ""
    link: ""
  technical: []
decisions: []
tasks:
  - id: H-001
    description: Si reducimos la latencia de entrega del SMS OTP, entonces
      disminuirá el abandono asociado a la espera del código (F-003, F-004,
      F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos retroalimentación clara en pantalla (estado de envío,
      número de destino enmascarado y contador), entonces reduciremos la
      incertidumbre y el abandono por desconfianza (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar más temprano, entonces
      disminuiremos la frustración durante la espera y aumentaremos los
      reintentos exitosos (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si evitamos que el reintento vuelva a demorar la entrega del
      código, entonces reduciremos la sensación de pérdida de tiempo y el
      abandono en el segundo intento (F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-005
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella),
      entonces recuperaremos usuarios que abandonan por la dependencia del SMS
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
  - id: H-001
    description: Si mostramos confirmación de envío, el número de destino
      enmascarado y un contador de espera, reduciremos la incertidumbre y el
      abandono (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si reducimos el tiempo de espera del código o comunicamos mejor su
      llegada, disminuiremos el abandono asociado a la demora (F-003, F-004).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar de forma más temprana/oportuna,
      reduciremos la frustración durante la espera (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella)
      para quienes no reciben el SMS, recuperaremos usuarios que abandonan
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
