id: otp-onboarding
title: Reducir el abandono en la verificación OTP del onboarding
version: 0
status: in_review
current_stage: descubrimiento
problem_statement: El 43.2% de los usuarios que llegan al paso de verificación
  OTP del onboarding lo abandonan, sin diferencias relevantes entre usuarios
  nuevos y recurrentes. Las causas principales son la demora en la entrega del
  código (71.9 s promedio en abandonos) y la falta de retroalimentación en
  pantalla que genera incertidumbre y desconfianza. El abandono puede ser
  definitivo, perdiendo usuarios de forma permanente.
outcomes:
  - metric: Tasa de abandono en el paso OTP (Happiness/Task success - HEART)
    baseline: 43.2% (136/315)
    target: Reducir a la mitad o menos (tentativo, a fijar por el humano)
    method: "Analítica de embudo: usuarios que abandonan el paso OTP / usuarios que
      llegan al paso OTP"
  - metric: Tiempo de espera del código OTP en casos de abandono (Efficiency - HEART)
    baseline: 71.9 s promedio (n=136)
    target: Disminuir el tiempo de entrega percibido y real (tentativo)
    method: Medición del tiempo entre solicitud de OTP y recepción/entrada del
      código en sesiones con abandono
  - metric: Tasa de finalización exitosa del OTP (Task success - HEART)
    baseline: 56.8% (179/315)
    target: Incrementar (tentativo)
    method: "Analítica de embudo: usuarios que completan verificación OTP / usuarios
      que llegan al paso OTP"
  - metric: Uso del botón de reenvío y éxito tras reintento (Engagement/Task success
      - HEART)
    baseline: null
    target: Reducir frustración y mejorar éxito en reintentos (tentativo)
    method: Eventos de clic en reenviar y tasa de finalización tras reenvío/reintento
scope:
  in_scope:
    - Mejorar la entrega y latencia del código OTP por SMS
    - "Añadir retroalimentación en pantalla: confirmación de envío, número de
      destino enmascarado y contador de tiempo"
    - Revisar la lógica de activación del botón de reenviar para habilitarlo
      antes
    - Mitigar la repetición de demoras en reintentos del paso OTP
    - Diseño de la pantalla de verificación OTP del onboarding
  non_goals:
    - Rediseñar el onboarding completo más allá del paso de verificación OTP
    - Implementar de inmediato métodos de verificación alternativos como
      biometría/huella (a explorar, no comprometido)
    - Segmentar la solución por tipo de usuario, dado que el abandono es similar
      entre nuevos y recurrentes
    - Cambios en la plataforma web de ingreso
constraints:
  regulatory: []
  accessibility: ""
  design_system:
    name: ""
    version: ""
    link: ""
  technical: []
decisions: []
tasks:
  - id: H-001
    description: Si reducimos la latencia de entrega del SMS OTP, entonces
      disminuirá el abandono asociado a la espera del código (F-003, F-004,
      F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos retroalimentación clara en pantalla (estado de envío,
      número de destino enmascarado y contador), entonces reduciremos la
      incertidumbre y el abandono por desconfianza (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar más temprano, entonces
      disminuiremos la frustración durante la espera y aumentaremos los
      reintentos exitosos (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si evitamos que el reintento vuelva a demorar la entrega del
      código, entonces reduciremos la sensación de pérdida de tiempo y el
      abandono en el segundo intento (F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-005
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella),
      entonces recuperaremos usuarios que abandonan por la dependencia del SMS
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
verification:
  - criterion: Todo hallazgo tiene evidencia anclada (archivo + locator + cita/cálculo)
    type: automated
    blocking: true
    status: pass
    evidence: 10/10 hallazgos anclados
  - criterion: Lo cuantitativo está computado, no estimado
    type: automated
    blocking: true
    status: pass
    evidence: 3/3 hallazgos cuantitativos con cálculo
  - criterion: Lo cualitativo tiene cita textual
    type: automated
    blocking: true
    status: pass
    evidence: 7/7 hallazgos cualitativos con cita
findings:
  - id: F-001
    statement: El 43.2% (136/315) de los usuarios que llegan al paso de verificación
      OTP abandonan sin completarlo.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas llego_a_otp+completo_otp — abandonan
          (completo_otp=0) entre los que llegan al paso OTP (llego_a_otp=1)
          (n=315)
        computation: drop-off OTP = 43.2% (136/315, n=315)
    confidence: high
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-002
    statement: El abandono en el paso OTP es prácticamente idéntico entre usuarios
      nuevos (42.9%) y recurrentes (43.4%), lo que sugiere que el problema no
      está segmentado por tipo de usuario.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
          entre los que llegan al OTP con segmento=nuevo (n=140)
        computation: drop-off OTP · segmento=nuevo = 42.9% (60/140, n=140)
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
          entre los que llegan al OTP con segmento=recurrente (n=175)
        computation: drop-off OTP · segmento=recurrente = 43.4% (76/175, n=175)
    confidence: high
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-003
    statement: En los casos de abandono, el tiempo de espera promedio del código es
      de 71.9 segundos, evidenciando demoras relevantes en la entrega del OTP.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columna tiempo_espera_seg — filas con abandono (n=136)
        computation: tiempo de espera promedio en abandonos = 71.9 s (n=136)
    confidence: high
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-004
    statement: "La demora en la llegada del SMS con el código es un motivo directo
      de abandono: usuarios cierran la app antes de recibirlo, llegando incluso
      minutos después."
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 3
        quote: Me cansé de esperar el código y cerré la app. Llegó como tres minutos
          después, cuando ya había abandonado.
      - source: entrevista-02.txt
        locator: párrafo 2
        quote: El SMS con el código siempre demora un montón en mi teléfono, a veces no
          llega.
    confidence: high
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
  - id: F-005
    statement: La falta de retroalimentación en pantalla (no se indica si el código
      fue enviado, a qué número llega, ni cuánto esperar) genera incertidumbre y
      desconfianza en la app.
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 5
        quote: No sabía si el código había sido enviado o no. La pantalla no decía nada,
          solo un campo vacío esperando.
      - source: entrevista-03.pdf
        locator: p.1, línea 5
        quote: Confuso. No me quedaba claro a qué número iba a llegar el SMS ni cuánto
          debía esperar.
      - source: entrevista-03.pdf
        locator: p.1, línea 8
        quote: incertidumbre me hizo dudar de la app.
    confidence: high
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
  - id: F-006
    statement: Los usuarios sugieren mostrar el número de destino enmascarado y un
      contador de tiempo como mejora para reducir la incertidumbre.
    type: qualitative
    evidence:
      - source: entrevista-03.pdf
        locator: p.1, línea 7
        quote: Que me dijeran "te enviamos el código al número terminado en 45" y un
          contador. Esa
    confidence: medium
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-007
    statement: El botón de reenviar el código se activa demasiado tarde, lo que
      aumenta la frustración del usuario durante la espera.
    type: qualitative
    evidence:
      - source: entrevista-02.txt
        locator: párrafo 3
        quote: Pido reenviar, pero el botón de reenviar recién se activa después de un
          rato largo. Eso me desespera.
    confidence: high
    status: validated
    feeds: constraints
    reviewed_by: null
    review_note: null
  - id: F-008
    statement: Algunos usuarios desean métodos de verificación alternativos (como
      huella) en lugar del SMS OTP.
    type: qualitative
    evidence:
      - source: entrevista-02.txt
        locator: párrafo 4
        quote: Esa vez no. Me rendí y entré desde la web más tarde. Si pudiera elegir
          otro método, usaría la huella.
    confidence: medium
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-009
    statement: "El abandono en OTP puede ser definitivo: usuarios indican que solo
      regresaron por necesidad de la cuenta y que de otro modo no volverían."
    type: qualitative
    evidence:
      - source: entrevista-03.pdf
        locator: p.1, línea 10
        quote: Casi. Lo dejé a medias y volví al día siguiente porque necesitaba la
          cuenta, pero si no la hubiera
      - source: entrevista-03.pdf
        locator: p.1, línea 11
        quote: necesitado, no vuelvo.
    confidence: medium
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-010
    statement: Reintentar el ingreso no resuelve el problema, ya que el código
      vuelve a demorar en el segundo intento, reforzando la sensación de pérdida
      de tiempo.
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 4
        quote: Sí, pero a la segunda me pidió el código otra vez y tampoco llegaba
          rápido. Sentí que perdía el tiempo.
    confidence: medium
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
