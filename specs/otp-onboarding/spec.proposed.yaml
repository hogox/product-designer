id: otp-onboarding
title: Reducir el abandono en la verificación OTP del onboarding
version: 2
status: in_review
current_stage: definicion
problem_statement: El 43.2% de los usuarios que llegan a la verificación OTP del
  onboarding abandonan sin completarla (F-001), un problema transversal a todos
  los segmentos (F-002). El abandono se origina en la demora del SMS (espera
  promedio de 71.9 s en abandonos), la falta de retroalimentación en pantalla,
  el reenvío tardío y la ausencia de métodos alternativos, lo que puede volverse
  permanente. Necesitamos reducir el abandono haciendo la espera transparente,
  accionable y ofreciendo alternativas de verificación.
outcomes:
  - metric: Tasa de finalización de la verificación OTP
    baseline: 56.8% (179/315 completan; complemento del 43.2% de abandono en F-001)
    target: ≥ 75% (tentativo, a fijar en la compuerta)
    method: "Funnel analytics: usuarios que completan OTP / usuarios que llegan al
      paso de OTP"
    heart: task_success
    signals:
      - Aumento de OTP verificados con éxito
      - Reducción de salidas/cierres de app en la pantalla de OTP
      - Reducción de eventos de abandono post-ingreso del número
  - metric: Tasa de abandono en el paso OTP
    baseline: "43.2% (136/315, n=315; segmentos casi idénticos: nuevos 42.9% y
      recurrentes 43.4% según F-002)"
    target: ≤ 25% (tentativo, a fijar en la compuerta)
    method: "Funnel analytics: usuarios que abandonan sin completar OTP / usuarios
      que llegan al paso de OTP, segmentado por nuevo vs. recurrente"
    heart: task_success
    signals:
      - Menos salidas durante la espera del código
      - Abandono consistente entre segmentos
      - Caída en cierres de app antes de recibir el SMS
  - metric: Tiempo de espera percibido y real hasta el ingreso del código
    baseline: 71.9 s promedio de espera en casos de abandono (n=136, F-003)
    target: Reducir el tiempo de espera asociado a abandono y mostrar feedback de
      espera estimada (tentativo)
    method: Telemetría de tiempo entre envío de OTP y verificación/abandono;
      medición del tiempo hasta primera interacción con contador en pantalla
    heart: happiness
    signals:
      - Menor tiempo de espera antes del abandono
      - Mayor visibilidad del contador y estado de envío en pantalla
      - Reducción de quejas por incertidumbre y desconfianza
  - metric: Uso del botón de reenviar y tiempo hasta su activación
    baseline: null
    target: Activar el reenvío en una ventana corta y aceptable (tentativo)
    method: "Eventos de UI: tiempo entre carga de pantalla y activación del botón de
      reenvío; tasa de uso y éxito tras reenvío"
    heart: engagement
    signals:
      - Menor tiempo de espera para que el botón de reenviar se active
      - Mayor proporción de verificaciones exitosas tras reenviar
      - Reducción de frustración reportada durante la espera
  - metric: Adopción de métodos de verificación alternativos (p. ej. huella digital)
    baseline: null
    target: Una porción relevante de usuarios usa el método alternativo cuando el
      SMS falla (tentativo)
    method: Analytics de selección de método de verificación; tasa de finalización
      por método
    heart: adoption
    signals:
      - Usuarios eligen verificación alternativa ante falla del SMS
      - Mayor finalización en casos donde el SMS no llega
      - Menor abandono atribuido a entrega fallida del código
  - metric: Retorno y reanudación del onboarding tras abandono
    baseline: null
    target: Aumentar la reanudación exitosa y evitar abandonos permanentes (tentativo)
    method: "Cohortes: usuarios que abandonan OTP y regresan a completar la
      verificación dentro de una ventana de tiempo"
    heart: retention
    signals:
      - Mayor reanudación del proceso de verificación tras abandono
      - Menos cuentas que quedan sin verificar de forma permanente
      - Reducción de retomas motivadas solo por necesidad
scope:
  in_scope:
    - Mejorar la entrega y latencia del código OTP por SMS
    - "Añadir retroalimentación en pantalla: confirmación de envío, número de
      destino enmascarado y contador de tiempo"
    - Revisar la lógica de activación del botón de reenviar para habilitarlo
      antes
    - Mitigar la repetición de demoras en reintentos del paso OTP
    - Diseño de la pantalla de verificación OTP del onboarding
  non_goals:
    - Rediseñar el onboarding completo más allá del paso de verificación OTP
    - Implementar de inmediato métodos de verificación alternativos como
      biometría/huella (a explorar, no comprometido)
    - Segmentar la solución por tipo de usuario, dado que el abandono es similar
      entre nuevos y recurrentes
    - Cambios en la plataforma web de ingreso
constraints:
  regulatory: []
  accessibility: ""
  design_system:
    name: ""
    version: ""
    link: ""
  technical: []
decisions: []
tasks:
  - id: H-001
    description: Si reducimos la latencia de entrega del SMS OTP, entonces
      disminuirá el abandono asociado a la espera del código (F-003, F-004,
      F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos retroalimentación clara en pantalla (estado de envío,
      número de destino enmascarado y contador), entonces reduciremos la
      incertidumbre y el abandono por desconfianza (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar más temprano, entonces
      disminuiremos la frustración durante la espera y aumentaremos los
      reintentos exitosos (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si evitamos que el reintento vuelva a demorar la entrega del
      código, entonces reduciremos la sensación de pérdida de tiempo y el
      abandono en el segundo intento (F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-005
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella),
      entonces recuperaremos usuarios que abandonan por la dependencia del SMS
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
verification:
  - criterion: Todo hallazgo tiene evidencia anclada (archivo + locator + cita/cálculo)
    type: automated
    blocking: true
    status: pass
    evidence: 8/8 hallazgos anclados
  - criterion: Lo cuantitativo está computado, no estimado
    type: automated
    blocking: true
    status: pass
    evidence: 3/3 hallazgos cuantitativos con cálculo
  - criterion: Lo cualitativo tiene cita textual
    type: automated
    blocking: true
    status: pass
    evidence: 5/5 hallazgos cualitativos con cita
findings:
  - id: F-001
    statement: El 43.2% de los usuarios que llegan al paso de verificación OTP
      abandonan sin completarlo (136 de 315).
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas llego_a_otp+completo_otp — abandonan
          (completo_otp=0) entre los que llegan al paso OTP (llego_a_otp=1)
          (n=315)
        computation: drop-off OTP = 43.2% (136/315, n=315)
    confidence: high
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-002
    statement: El abandono en OTP es prácticamente idéntico entre usuarios nuevos
      (42.9%) y recurrentes (43.4%), lo que sugiere que el problema no depende
      del segmento.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
          entre los que llegan al OTP con segmento=nuevo (n=140)
        computation: drop-off OTP · segmento=nuevo = 42.9% (60/140, n=140)
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
          entre los que llegan al OTP con segmento=recurrente (n=175)
        computation: drop-off OTP · segmento=recurrente = 43.4% (76/175, n=175)
    confidence: high
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-003
    statement: En los casos de abandono, el tiempo de espera promedio del código fue
      de 71.9 segundos.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columna tiempo_espera_seg — filas con abandono (n=136)
        computation: tiempo de espera promedio en abandonos = 71.9 s (n=136)
    confidence: high
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-004
    statement: "La demora en la llegada del SMS con el código es un motivo directo
      de abandono: los usuarios se cansan de esperar y cierran o salen de la app
      antes de recibirlo."
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 3
        quote: Me cansé de esperar el código y cerré la app. Llegó como tres minutos
          después, cuando ya había abandonado.
      - source: entrevista-02.txt
        locator: párrafo 2
        quote: El SMS con el código siempre demora un montón en mi teléfono, a veces no
          llega.
    confidence: high
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
  - id: F-005
    statement: La falta de retroalimentación en pantalla (no indicar si el código
      fue enviado, a qué número llega ni cuánto esperar) genera incertidumbre y
      desconfianza en la app.
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 5
        quote: No sabía si el código había sido enviado o no. La pantalla no decía nada,
          solo un campo vacío esperando.
      - source: entrevista-03.pdf
        locator: p.1, línea 5
        quote: Confuso. No me quedaba claro a qué número iba a llegar el SMS ni cuánto
          debía esperar.
      - source: entrevista-03.pdf
        locator: p.1, línea 7
        quote: Que me dijeran "te enviamos el código al número terminado en 45" y un
          contador. Esa
      - source: entrevista-03.pdf
        locator: p.1, línea 8
        quote: incertidumbre me hizo dudar de la app.
    confidence: high
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
  - id: F-006
    statement: El botón de reenviar el código tarda demasiado en activarse, lo que
      aumenta la frustración del usuario durante la espera.
    type: qualitative
    evidence:
      - source: entrevista-02.txt
        locator: párrafo 3
        quote: Pido reenviar, pero el botón de reenviar recién se activa después de un
          rato largo. Eso me desespera.
    confidence: medium
    status: validated
    feeds: constraints
    reviewed_by: null
    review_note: null
  - id: F-007
    statement: Existe interés por métodos de verificación alternativos al SMS, como
      la huella digital, especialmente ante fallas en la entrega del código.
    type: qualitative
    evidence:
      - source: entrevista-02.txt
        locator: párrafo 4
        quote: Esa vez no. Me rendí y entré desde la web más tarde. Si pudiera elegir
          otro método, usaría la huella.
    confidence: medium
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-008
    statement: "El abandono puede volverse permanente: algunos usuarios solo retoman
      el proceso porque necesitan la cuenta, y de lo contrario no regresarían."
    type: qualitative
    evidence:
      - source: entrevista-03.pdf
        locator: p.1, línea 10
        quote: Casi. Lo dejé a medias y volví al día siguiente porque necesitaba la
          cuenta, pero si no la hubiera
      - source: entrevista-03.pdf
        locator: p.1, línea 11
        quote: necesitado, no vuelvo.
    confidence: medium
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
jtbd:
  - id: J-001
    statement: Cuando ingreso mi número y espero el código OTP, quiero saber que el
      código fue enviado, a qué número llega y cuánto debo esperar, para tener
      certeza y confiar en la app en lugar de abandonar.
    supported_by:
      - F-005
      - F-001
  - id: J-002
    statement: Cuando el SMS con el código demora demasiado en llegar, quiero
      recibirlo a tiempo o poder reenviarlo de inmediato, para completar la
      verificación antes de cansarme y salir de la app.
    supported_by:
      - F-003
      - F-004
      - F-006
  - id: J-003
    statement: Cuando el código no llega o falla la entrega del SMS, quiero elegir
      un método de verificación alternativo (como la huella digital), para
      completar el onboarding sin depender únicamente del SMS.
    supported_by:
      - F-007
      - F-004
  - id: J-004
    statement: Cuando abandono la verificación a medias, quiero retomar el proceso
      fácilmente, para no perder el progreso ni quedar fuera de la cuenta de
      forma permanente.
    supported_by:
      - F-008
