id: otp-onboarding
title: Reducir el abandono en la verificación OTP del onboarding
product: Onboarding
description: null
archived: false
version: 3
status: in_review
current_stage: definicion
problem_statement: El 43.2% de los usuarios que llegan al paso de verificación
  OTP lo abandonan sin completarlo, sin diferencias relevantes entre segmentos.
  La demora en la recepción del código SMS (promedio de 71.9 s en abandonos) y
  la falta de retroalimentación en pantalla generan incertidumbre, frustración
  y, en algunos casos, pérdida definitiva de usuarios. Necesitamos reducir el
  abandono en la verificación OTP mejorando la inmediatez del código, la
  transparencia del proceso y las opciones de verificación.
outcomes:
  - metric: Tasa de finalización del paso de verificación OTP
    baseline: "56.8% completan (179/315; derivado de F-001: 43.2% abandono)"
    target: Aumentar la tasa de finalización (a fijar en la compuerta)
    method: "Embudo de eventos: usuarios que ingresan al paso OTP vs. usuarios que
      verifican exitosamente."
    heart: task_success
    signals:
      - Códigos verificados correctamente
      - Reducción de abandonos en el paso OTP
      - Verificaciones completadas en el primer intento
  - metric: Tasa de abandono en el paso OTP
    baseline: 43.2% (136/315; F-001)
    target: Reducir el abandono (a fijar en la compuerta)
    method: Proporción de usuarios que llegan al paso OTP y lo abandonan sin
      completar la verificación.
    heart: task_success
    signals:
      - Cierres de app en pantalla OTP
      - Salidas sin ingresar el código
      - Abandono similar entre segmentos nuevo/recurrente (F-002)
  - metric: Tiempo de espera del código hasta la verificación
    baseline: 71.9 s promedio en abandonos (n=136; F-003)
    target: Reducir el tiempo de espera del código (a fijar en la compuerta)
    method: Medir latencia entre solicitud/envío del OTP y su recepción/ingreso por
      el usuario.
    heart: task_success
    signals:
      - Tiempo hasta ingresar el código
      - Tasa de no recepción del SMS
      - Correlación entre demora y abandono (F-004)
  - metric: Uso del reenvío de código y su efectividad
    baseline: null
    target: Tiempo de activación del reenvío más corto y mayor éxito tras reenviar
      (a fijar en la compuerta)
    method: Eventos de tap en 'reenviar', tiempo hasta habilitación del botón y
      verificación posterior al reenvío.
    heart: engagement
    signals:
      - Clics en reenviar
      - Tiempo de espera para habilitar reenvío
      - Verificación exitosa tras reintento (F-007, F-010)
  - metric: Claridad percibida del proceso de verificación
    baseline: null
    target: Mejorar la percepción de claridad y confianza (a fijar en la compuerta)
    method: Encuesta breve post-verificación o microencuesta de claridad/confianza
      en pantalla OTP.
    heart: happiness
    signals:
      - Confianza reportada en la app
      - Comprensión de a qué número llega el código
      - Percepción de incertidumbre (F-005, F-006)
  - metric: Adopción de método de verificación alternativo (p. ej. huella)
    baseline: null
    target: Definir disponibilidad y adopción de método alternativo (a fijar en la
      compuerta)
    method: Porcentaje de usuarios que eligen un método alternativo cuando está
      disponible y completan verificación.
    heart: adoption
    signals:
      - Selección de método alternativo
      - Verificación exitosa por método alternativo (F-008)
  - metric: Retorno y permanencia tras la verificación
    baseline: null
    target: Reducir la pérdida definitiva de usuarios tras abandono (a fijar en la
      compuerta)
    method: Seguimiento de usuarios que abandonan el OTP y su retorno/finalización
      posterior del onboarding.
    heart: retention
    signals:
      - Usuarios que no regresan tras abandonar
      - Reanudación del onboarding al día siguiente (F-009)
scope:
  in_scope:
    - Mejorar la entrega y latencia del código OTP por SMS
    - "Añadir retroalimentación en pantalla: confirmación de envío, número de
      destino enmascarado y contador de tiempo"
    - Revisar la lógica de activación del botón de reenviar para habilitarlo
      antes
    - Mitigar la repetición de demoras en reintentos del paso OTP
    - Diseño de la pantalla de verificación OTP del onboarding
  non_goals:
    - Rediseñar el onboarding completo más allá del paso de verificación OTP
    - Implementar de inmediato métodos de verificación alternativos como
      biometría/huella (a explorar, no comprometido)
    - Segmentar la solución por tipo de usuario, dado que el abandono es similar
      entre nuevos y recurrentes
    - Cambios en la plataforma web de ingreso
constraints:
  regulatory: []
  accessibility: ""
  design_system:
    name: ""
    version: ""
    link: ""
  technical: []
decisions: []
tasks:
  - id: H-001
    description: Si reducimos la latencia de entrega del SMS OTP, entonces
      disminuirá el abandono asociado a la espera del código (F-003, F-004,
      F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos retroalimentación clara en pantalla (estado de envío,
      número de destino enmascarado y contador), entonces reduciremos la
      incertidumbre y el abandono por desconfianza (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar más temprano, entonces
      disminuiremos la frustración durante la espera y aumentaremos los
      reintentos exitosos (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si evitamos que el reintento vuelva a demorar la entrega del
      código, entonces reduciremos la sensación de pérdida de tiempo y el
      abandono en el segundo intento (F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-005
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella),
      entonces recuperaremos usuarios que abandonan por la dependencia del SMS
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
