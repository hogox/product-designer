id: otp-onboarding
title: Reducir el abandono en la verificación OTP del onboarding
product: Onboarding
description: null
archived: false
version: 3
status: approved
current_stage: exploracion
problem_statement: El 43.2% de los usuarios que llegan a la verificación OTP del
  onboarding la abandonan sin completarla, sin diferencias por segmento. Las
  causas principales son la demora en la llegada del SMS, la falta de
  retroalimentación en pantalla y un botón de reenvío que tarda en activarse, lo
  que genera frustración, desconfianza y, en algunos casos, abandono permanente.
  Necesitamos reducir el abandono mejorando la experiencia de espera y
  ofreciendo claridad y alternativas de verificación.
outcomes:
  - metric: Tasa de finalización de la verificación OTP
    baseline: 56.8% (179/315 completan; drop-off 43.2%)
    target: ≥75% de finalización (tentativo)
    method: "Analítica de embudo: usuarios que completan OTP / usuarios que llegan
      al paso de OTP"
    heart: task_success
    signals:
      - Códigos OTP ingresados correctamente
      - Avance al siguiente paso del onboarding tras OTP
      - Reducción de cierres de app en pantalla de OTP
  - metric: Tasa de abandono en el paso de OTP
    baseline: 43.2% (136/315)
    target: ≤25% de abandono (tentativo)
    method: "Analítica de embudo: usuarios que abandonan en OTP / usuarios que
      llegan al paso de OTP, segmentado por nuevo vs recurrente"
    heart: task_success
    signals:
      - Salidas o cierres de app en pantalla OTP
      - Abandonos antes de recibir el código
      - Paridad de abandono entre segmentos nuevo y recurrente
  - metric: Tiempo de espera del código hasta su ingreso o abandono
    baseline: 71.9 s promedio de espera en casos de abandono (n=136)
    target: Reducir el tiempo de espera percibido y entregar feedback visible desde
      el segundo 0 (tentativo)
    method: Telemetría de tiempo entre solicitud de código e ingreso/abandono;
      instrumentar contador en pantalla
    heart: engagement
    signals:
      - Tiempo desde solicitud hasta recepción del SMS
      - Tiempo hasta primer intento de ingreso
      - Visualización del contador de espera en pantalla
  - metric: Uso del reenvío de código
    baseline: null
    target: Activación del botón de reenvío en un tiempo razonable y reducción de
      frustración asociada (tentativo)
    method: Eventos de tap en 'reenviar' y tiempo hasta que el botón se habilita;
      correlación con finalización posterior
    heart: engagement
    signals:
      - Clics en botón de reenviar
      - Tiempo hasta habilitación del botón
      - Finalización tras reenvío
  - metric: Adopción de métodos de verificación alternativos (p. ej. huella digital)
    baseline: null
    target: Disponibilizar y lograr adopción de un método alternativo ante fallas de
      SMS (tentativo)
    method: "Analítica de eventos: usuarios que eligen método alternativo / usuarios
      que enfrentan falla o demora en SMS"
    heart: adoption
    signals:
      - Selección de método alternativo
      - Finalización vía método alternativo tras falla de SMS
  - metric: Reintento y recuperación tras abandono del onboarding
    baseline: null
    target: Aumentar el retorno y finalización de usuarios que abandonaron OTP
      (tentativo)
    method: Cohortes de usuarios que abandonan OTP y posteriormente retoman y
      completan el proceso
    heart: retention
    signals:
      - Retorno al flujo de onboarding tras abandono
      - Finalización en sesión posterior
      - Reducción de abandonos permanentes
scope:
  in_scope:
    - Mejorar la entrega y latencia del código OTP por SMS
    - "Añadir retroalimentación en pantalla: confirmación de envío, número de
      destino enmascarado y contador de tiempo"
    - Revisar la lógica de activación del botón de reenviar para habilitarlo
      antes
    - Mitigar la repetición de demoras en reintentos del paso OTP
    - Diseño de la pantalla de verificación OTP del onboarding
  non_goals:
    - Rediseñar el onboarding completo más allá del paso de verificación OTP
    - Implementar de inmediato métodos de verificación alternativos como
      biometría/huella (a explorar, no comprometido)
    - Segmentar la solución por tipo de usuario, dado que el abandono es similar
      entre nuevos y recurrentes
    - Cambios en la plataforma web de ingreso
constraints:
  regulatory: []
  accessibility: ""
  design_system:
    name: ""
    version: ""
    link: ""
  technical: []
decisions:
  - id: DEC-001
    date: 2026-06-11
    decision: "Selección de conceptos de solución: C-001, C-002, C-003"
    rationale: C-001 y C-002 atacan el feedback de espera y el reenvío con el menor
      costo; C-003 cubre las fallas de entrega del SMS. Descartamos multicanal
      (alcance mayor) y verificación alternativa (solapa con C-001).
    author: Hugo Muñoz (Lead PM)
    supersedes: null
tasks:
  - id: H-001
    description: Si reducimos la latencia de entrega del SMS OTP, entonces
      disminuirá el abandono asociado a la espera del código (F-003, F-004,
      F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos retroalimentación clara en pantalla (estado de envío,
      número de destino enmascarado y contador), entonces reduciremos la
      incertidumbre y el abandono por desconfianza (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar más temprano, entonces
      disminuiremos la frustración durante la espera y aumentaremos los
      reintentos exitosos (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si evitamos que el reintento vuelva a demorar la entrega del
      código, entonces reduciremos la sensación de pérdida de tiempo y el
      abandono en el segundo intento (F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-005
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella),
      entonces recuperaremos usuarios que abandonan por la dependencia del SMS
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
