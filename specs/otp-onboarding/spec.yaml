id: otp-onboarding
title: Reducir el abandono en la verificación OTP del onboarding
version: 2
status: approved
current_stage: definicion
problem_statement: El 43.2% de los usuarios que llegan al paso de verificación
  OTP lo abandonan (136/315), sin diferencias relevantes entre segmentos. La
  demora en recibir el código SMS (71.9 s promedio en abandonos), la falta de
  feedback en pantalla y un botón de reenvío que se habilita tarde generan
  incertidumbre y frustración que llevan al abandono. Necesitamos reducir esta
  fuga mejorando la comunicación durante la espera, el control de reenvío y
  ofreciendo alternativas de verificación.
outcomes:
  - metric: Tasa de finalización de la verificación OTP
    baseline: 56.8% (179/315)
    target: ≥75%
    method: "Funnel analytics del paso OTP: usuarios que completan / usuarios que
      llegan al paso"
    heart: task_success
    signals:
      - Aumento de OTP completados
      - Reducción de salidas en la pantalla OTP
      - Menor proporción de sesiones que terminan en el campo de código vacío
  - metric: Tasa de abandono en el paso OTP
    baseline: 43.2% (136/315)
    target: ≤25%
    method: "Funnel analytics: usuarios que abandonan sin completar / usuarios que
      llegan al paso OTP"
    heart: retention
    signals:
      - Disminución de cierres de app durante la espera
      - Reducción del abandono en segmentos nuevo y recurrente
  - metric: Tiempo de espera percibido hasta recibir/reenviar el código
    baseline: 71.9 s promedio en abandonos
    target: ≤30 s percibidos con feedback visible
    method: Medición del tiempo entre envío del código y acción del usuario;
      instrumentación del contador y del botón de reenvío
    heart: happiness
    signals:
      - Uso del contador de espera
      - Clics en reenviar tras habilitación temprana
      - Menos comentarios de frustración por espera
  - metric: Adopción de métodos de verificación alternativos (p. ej. huella)
    baseline: null
    target: ≥20% de usuarios eligen alternativa cuando el SMS falla
    method: Tracking de selección de método de verificación en el paso OTP
    heart: adoption
    signals:
      - Selección de huella u otro método
      - Finalización vía método alternativo tras fallo de SMS
  - metric: Interacción con feedback de pantalla (número enmascarado y contador)
    baseline: null
    target: Mayoría de usuarios visualiza el número enmascarado y el contador
    method: Eventos de visualización e interacción con los elementos de feedback en
      la pantalla OTP
    heart: engagement
    signals:
      - Visualización del número de destino enmascarado
      - Permanencia en pantalla con contador activo
      - Menor tasa de salida inmediata
scope:
  in_scope:
    - Mejorar la entrega y latencia del código OTP por SMS
    - "Añadir retroalimentación en pantalla: confirmación de envío, número de
      destino enmascarado y contador de tiempo"
    - Revisar la lógica de activación del botón de reenviar para habilitarlo
      antes
    - Mitigar la repetición de demoras en reintentos del paso OTP
    - Diseño de la pantalla de verificación OTP del onboarding
  non_goals:
    - Rediseñar el onboarding completo más allá del paso de verificación OTP
    - Implementar de inmediato métodos de verificación alternativos como
      biometría/huella (a explorar, no comprometido)
    - Segmentar la solución por tipo de usuario, dado que el abandono es similar
      entre nuevos y recurrentes
    - Cambios en la plataforma web de ingreso
constraints:
  regulatory: []
  accessibility: ""
  design_system:
    name: ""
    version: ""
    link: ""
  technical: []
decisions: []
tasks:
  - id: H-001
    description: Si reducimos la latencia de entrega del SMS OTP, entonces
      disminuirá el abandono asociado a la espera del código (F-003, F-004,
      F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos retroalimentación clara en pantalla (estado de envío,
      número de destino enmascarado y contador), entonces reduciremos la
      incertidumbre y el abandono por desconfianza (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si habilitamos el botón de reenviar más temprano, entonces
      disminuiremos la frustración durante la espera y aumentaremos los
      reintentos exitosos (F-007).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si evitamos que el reintento vuelva a demorar la entrega del
      código, entonces reduciremos la sensación de pérdida de tiempo y el
      abandono en el segundo intento (F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-005
    description: Si ofrecemos un método de verificación alternativo (p. ej. huella),
      entonces recuperaremos usuarios que abandonan por la dependencia del SMS
      (F-008, F-009).
    stage: definicion
    owner: human
    status: todo
verification:
  - criterion: Todo hallazgo tiene evidencia anclada (archivo + locator + cita/cálculo)
    type: automated
    blocking: true
    status: pass
    evidence: 8/8 hallazgos anclados
  - criterion: Lo cuantitativo está computado, no estimado
    type: automated
    blocking: true
    status: pass
    evidence: 3/3 hallazgos cuantitativos con cálculo
  - criterion: Lo cualitativo tiene cita textual
    type: automated
    blocking: true
    status: pass
    evidence: 5/5 hallazgos cualitativos con cita
findings:
  - id: F-001
    statement: El 43.2% de los usuarios que llegan al paso de verificación OTP lo
      abandonan sin completarlo (136 de 315), lo que evidencia una fuga
      significativa en esta etapa del onboarding.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas llego_a_otp+completo_otp — abandonan
          (completo_otp=0) entre los que llegan al paso OTP (llego_a_otp=1)
          (n=315)
        computation: drop-off OTP = 43.2% (136/315, n=315)
    confidence: high
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-002
    statement: El abandono en el paso OTP es prácticamente igual entre usuarios
      nuevos (42.9%) y recurrentes (43.4%), por lo que el problema no parece
      depender del segmento.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
          entre los que llegan al OTP con segmento=nuevo (n=140)
        computation: drop-off OTP · segmento=nuevo = 42.9% (60/140, n=140)
      - source: funnel-otp.csv
        locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
          entre los que llegan al OTP con segmento=recurrente (n=175)
        computation: drop-off OTP · segmento=recurrente = 43.4% (76/175, n=175)
    confidence: high
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-003
    statement: En los casos de abandono, el tiempo de espera promedio fue de 71.9
      segundos, lo que sugiere que la demora en recibir el código está asociada
      al abandono.
    type: quantitative
    evidence:
      - source: funnel-otp.csv
        locator: hoja 'csv', columna tiempo_espera_seg — filas con abandono (n=136)
        computation: tiempo de espera promedio en abandonos = 71.9 s (n=136)
    confidence: medium
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
  - id: F-004
    statement: La demora en la llegada del código SMS lleva a los usuarios a
      cansarse y abandonar la app antes de recibirlo.
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 3
        quote: Me cansé de esperar el código y cerré la app. Llegó como tres minutos
          después, cuando ya había abandonado.
      - source: entrevista-02.txt
        locator: párrafo 2
        quote: El SMS con el código siempre demora un montón en mi teléfono, a veces no
          llega.
    confidence: high
    status: validated
    feeds: hypothesis
    reviewed_by: null
    review_note: null
  - id: F-005
    statement: La falta de feedback en la pantalla (no saber si el código fue
      enviado, a qué número llegará ni cuánto esperar) genera incertidumbre y
      duda sobre la app.
    type: qualitative
    evidence:
      - source: entrevista-01.txt
        locator: párrafo 5
        quote: No sabía si el código había sido enviado o no. La pantalla no decía nada,
          solo un campo vacío esperando.
      - source: entrevista-03.pdf
        locator: p.1, línea 5
        quote: Confuso. No me quedaba claro a qué número iba a llegar el SMS ni cuánto
          debía esperar.
      - source: entrevista-03.pdf
        locator: p.1, línea 8
        quote: incertidumbre me hizo dudar de la app.
    confidence: high
    status: validated
    feeds: outcomes
    reviewed_by: null
    review_note: null
  - id: F-006
    statement: Los usuarios desean indicaciones claras como mostrar el número de
      destino enmascarado y un contador de tiempo durante la espera del código.
    type: qualitative
    evidence:
      - source: entrevista-03.pdf
        locator: p.1, línea 7
        quote: Que me dijeran "te enviamos el código al número terminado en 45" y un
          contador. Esa
    confidence: medium
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
  - id: F-007
    statement: El botón de reenviar el código se habilita demasiado tarde, lo que
      genera frustración en los usuarios que esperan reenviar.
    type: qualitative
    evidence:
      - source: entrevista-02.txt
        locator: párrafo 3
        quote: Pido reenviar, pero el botón de reenviar recién se activa después de un
          rato largo. Eso me desespera.
    confidence: medium
    status: validated
    feeds: constraints
    reviewed_by: null
    review_note: null
  - id: F-008
    statement: Algunos usuarios preferirían métodos de verificación alternativos
      como la huella en lugar del código SMS.
    type: qualitative
    evidence:
      - source: entrevista-02.txt
        locator: párrafo 4
        quote: Esa vez no. Me rendí y entré desde la web más tarde. Si pudiera elegir
          otro método, usaría la huella.
    confidence: medium
    status: validated
    feeds: scope
    reviewed_by: null
    review_note: null
jtbd:
  - id: J-001
    statement: Cuando estoy esperando el código OTP en el onboarding, quiero saber
      si el código fue enviado, a qué número y cuánto debo esperar, para tener
      certeza y no dudar de la app ni abandonar.
    supported_by:
      - F-005
      - F-006
  - id: J-002
    statement: Cuando el código SMS tarda demasiado en llegar, quiero poder
      reenviarlo rápidamente sin esperas largas, para completar la verificación
      sin frustrarme.
    supported_by:
      - F-003
      - F-004
      - F-007
  - id: J-003
    statement: Cuando el SMS no llega o demora mucho en mi teléfono, quiero elegir
      un método de verificación alternativo como la huella, para completar el
      onboarding sin depender del código.
    supported_by:
      - F-004
      - F-008
  - id: J-004
    statement: Cuando llego al paso de verificación OTP, quiero completarlo de forma
      fluida independientemente de si soy usuario nuevo o recurrente, para no
      quedarme atascado en el onboarding.
    supported_by:
      - F-001
      - F-002
