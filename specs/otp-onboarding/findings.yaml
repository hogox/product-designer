- id: F-001
  statement: El 43.2% de los usuarios que llegan al paso de verificación OTP
    abandonan sin completarlo (136 de 315).
  type: quantitative
  evidence:
    - source: funnel-otp.csv
      locator: hoja 'csv', columnas llego_a_otp+completo_otp — abandonan
        (completo_otp=0) entre los que llegan al paso OTP (llego_a_otp=1)
        (n=315)
      computation: drop-off OTP = 43.2% (136/315, n=315)
  confidence: high
  status: validated
  feeds: outcomes
  reviewed_by: null
  review_note: null
- id: F-002
  statement: El abandono en OTP es prácticamente idéntico entre usuarios nuevos
    (42.9%) y recurrentes (43.4%), lo que sugiere que el problema no depende del
    segmento.
  type: quantitative
  evidence:
    - source: funnel-otp.csv
      locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
        entre los que llegan al OTP con segmento=nuevo (n=140)
      computation: drop-off OTP · segmento=nuevo = 42.9% (60/140, n=140)
    - source: funnel-otp.csv
      locator: hoja 'csv', columnas segmento+llego_a_otp+completo_otp — abandonan
        entre los que llegan al OTP con segmento=recurrente (n=175)
      computation: drop-off OTP · segmento=recurrente = 43.4% (76/175, n=175)
  confidence: high
  status: validated
  feeds: scope
  reviewed_by: null
  review_note: null
- id: F-003
  statement: En los casos de abandono, el tiempo de espera promedio del código fue
    de 71.9 segundos.
  type: quantitative
  evidence:
    - source: funnel-otp.csv
      locator: hoja 'csv', columna tiempo_espera_seg — filas con abandono (n=136)
      computation: tiempo de espera promedio en abandonos = 71.9 s (n=136)
  confidence: high
  status: validated
  feeds: outcomes
  reviewed_by: null
  review_note: null
- id: F-004
  statement: "La demora en la llegada del SMS con el código es un motivo directo
    de abandono: los usuarios se cansan de esperar y cierran o salen de la app
    antes de recibirlo."
  type: qualitative
  evidence:
    - source: entrevista-01.txt
      locator: párrafo 3
      quote: Me cansé de esperar el código y cerré la app. Llegó como tres minutos
        después, cuando ya había abandonado.
    - source: entrevista-02.txt
      locator: párrafo 2
      quote: El SMS con el código siempre demora un montón en mi teléfono, a veces no
        llega.
  confidence: high
  status: validated
  feeds: hypothesis
  reviewed_by: null
  review_note: null
- id: F-005
  statement: La falta de retroalimentación en pantalla (no indicar si el código
    fue enviado, a qué número llega ni cuánto esperar) genera incertidumbre y
    desconfianza en la app.
  type: qualitative
  evidence:
    - source: entrevista-01.txt
      locator: párrafo 5
      quote: No sabía si el código había sido enviado o no. La pantalla no decía nada,
        solo un campo vacío esperando.
    - source: entrevista-03.pdf
      locator: p.1, línea 5
      quote: Confuso. No me quedaba claro a qué número iba a llegar el SMS ni cuánto
        debía esperar.
    - source: entrevista-03.pdf
      locator: p.1, línea 7
      quote: Que me dijeran "te enviamos el código al número terminado en 45" y un
        contador. Esa
    - source: entrevista-03.pdf
      locator: p.1, línea 8
      quote: incertidumbre me hizo dudar de la app.
  confidence: high
  status: validated
  feeds: hypothesis
  reviewed_by: null
  review_note: null
- id: F-006
  statement: El botón de reenviar el código tarda demasiado en activarse, lo que
    aumenta la frustración del usuario durante la espera.
  type: qualitative
  evidence:
    - source: entrevista-02.txt
      locator: párrafo 3
      quote: Pido reenviar, pero el botón de reenviar recién se activa después de un
        rato largo. Eso me desespera.
  confidence: medium
  status: validated
  feeds: constraints
  reviewed_by: null
  review_note: null
- id: F-007
  statement: Existe interés por métodos de verificación alternativos al SMS, como
    la huella digital, especialmente ante fallas en la entrega del código.
  type: qualitative
  evidence:
    - source: entrevista-02.txt
      locator: párrafo 4
      quote: Esa vez no. Me rendí y entré desde la web más tarde. Si pudiera elegir
        otro método, usaría la huella.
  confidence: medium
  status: validated
  feeds: scope
  reviewed_by: null
  review_note: null
- id: F-008
  statement: "El abandono puede volverse permanente: algunos usuarios solo retoman
    el proceso porque necesitan la cuenta, y de lo contrario no regresarían."
  type: qualitative
  evidence:
    - source: entrevista-03.pdf
      locator: p.1, línea 10
      quote: Casi. Lo dejé a medias y volví al día siguiente porque necesitaba la
        cuenta, pero si no la hubiera
    - source: entrevista-03.pdf
      locator: p.1, línea 11
      quote: necesitado, no vuelvo.
  confidence: medium
  status: validated
  feeds: outcomes
  reviewed_by: null
  review_note: null
