- id: F-005
  statement: "La demora en la llegada del código OTP (especialmente vía SMS) es un
    detonante central del abandono: los usuarios se cansan de esperar y cierran
    la app antes de que el código llegue."
  type: qualitative
  evidence:
    - source: entrevista-01.txt
      locator: párrafo 3
      quote: Me cansé de esperar el código y cerré la app. Llegó como tres minutos
        después, cuando ya había abandonado.
    - source: entrevista-02.txt
      locator: párrafo 2
      quote: El SMS con el código siempre demora un montón en mi teléfono, a veces no
        llega.
    - source: funnel-otp.csv
      locator: hoja 'csv', columna tiempo_espera_seg — filas con abandono (n=136)
      computation: tiempo_espera_seg promedio en abandonos = 71.9 s (n=136)
  confidence: high
  status: proposed
  feeds: hypothesis
  review_status: aprobado
  reviewed_by: Hugo Muñoz (Lead PM)
  review_note: null
  reviewed_at: 2026-06-15T19:50:59.517Z
- id: F-006
  statement: La falta de retroalimentación en pantalla (no saber si el código fue
    enviado, a qué número llega ni cuánto esperar) genera incertidumbre que
    lleva a dudar de la app y abandonar.
  type: qualitative
  evidence:
    - source: entrevista-01.txt
      locator: párrafo 5
      quote: No sabía si el código había sido enviado o no. La pantalla no decía nada,
        solo un campo vacío esperando.
    - source: entrevista-03.pdf
      locator: p.1, bloque 1
      quote: Confuso. No me quedaba claro a qué número iba a llegar el SMS ni cuánto
        debía esperar.
    - source: entrevista-03.pdf
      locator: p.1, bloque 1
      quote: Que me dijeran "te enviamos el código al número terminado en 45" y un
        contador. Esa incertidumbre me hizo dudar de la app.
  confidence: high
  status: proposed
  feeds: hypothesis
  review_status: aprobado
  reviewed_by: Hugo Muñoz (Lead PM)
  review_note: null
  reviewed_at: 2026-06-15T19:51:00.516Z
