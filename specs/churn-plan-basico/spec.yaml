id: churn-plan-basico
title: Reducir el churn en usuarios del plan básico
product: Retención
description: Los usuarios del plan básico muestran una tasa de abandono del 28.3%
  en los primeros 90 días, impactando directamente el LTV y la rentabilidad.
archived: false
version: 2
status: approved
current_stage: diseno
problem_statement: El 28.3% de los usuarios del plan básico (847 de 2,993) cancela
  su suscripción dentro de los primeros 90 días. El 62% de los churners nunca activó
  las 3 funciones clave del producto; los usuarios que sí lo hacen tienen un 67%
  menos de churn. El soporte para plan básico tarda 4.7 h en promedio (3.9× más
  lento que premium) y el NPS del plan básico es −12. La causa raíz es un onboarding
  que no conecta al usuario con el valor diferencial del producto y un soporte insuficiente
  cuando el usuario se pierde, lo que lleva al abandono antes de alcanzar el momento
  de activación.
outcomes:
  - metric: Tasa de churn a 90 días del plan básico
    baseline: 28.3% (847/2,993)
    target: ≤18% a los 90 días
    method: "Cohortes mensuales: cancelaciones o no-renovaciones / usuarios activos
      al inicio del período"
    heart: retention
    signals:
      - Cancelaciones dentro de los 90 días
      - Solicitudes de baja en el primer trimestre
      - Ratio de renovación mensual en plan básico
  - metric: Tasa de activación de las 3 funciones clave (primeros 14 días)
    baseline: 38% (1,136/2,993 usuarios activan las 3 funciones)
    target: ≥65% de activación de las 3 funciones en los primeros 14 días
    method: "Eventos de producto: primer uso de cada función clave en ventana de 14
      días tras alta"
    heart: adoption
    signals:
      - Primeros usos de cada función clave
      - Tiempo hasta primera activación por función
      - Completitud del onboarding guiado
  - metric: Tiempo de primera respuesta de soporte (plan básico)
    baseline: 4.7 horas promedio
    target: ≤2 horas
    method: "Tickets: tiempo entre apertura y primera respuesta agente, segmentado
      por plan"
    heart: happiness
    signals:
      - Tiempo de primera respuesta por ticket
      - CSAT post-soporte
      - Tasa de reapertura de tickets resueltos
  - metric: NPS del plan básico
    baseline: "−12 (promotores 18%, detractores 30%)"
    target: "≥+15"
    method: Encuesta NPS mensual a usuarios del plan básico con más de 30 días de
      antigüedad
    heart: happiness
    signals:
      - Score NPS mensual
      - Calificación de valor percibido
      - Menciones de precio vs. valor en respuestas abiertas
  - metric: "Conversión básico → premium (upsell)"
    baseline: 3.1% mensual (93/2,993)
    target: ≥6% mensual
    method: Eventos de upgrade completado / usuarios básicos activos al inicio del
      mes
    heart: engagement
    signals:
      - Clics en 'ver planes premium'
      - Inicios de flujo de upgrade
      - Upgrades completados en 30 días
scope:
  in_scope:
    - Rediseño del onboarding guiado para los primeros 14 días del plan básico
    - Activación progresiva de las 3 funciones clave del producto
    - "Panel de valor activado: muestra el impacto real de cada función activada"
    - Soporte en contexto (tooltips, guías in-app, acceso rápido a ayuda)
    - Comunicaciones por email y notificaciones push durante el período de activación
  non_goals:
    - Cambiar la estructura de precios o los límites del plan básico
    - Rediseñar el flujo de alta (pre-onboarding)
    - Implementar soporte por chat en vivo (evaluado para fase posterior)
    - Personalización avanzada para cuentas B2B (scope separado)
constraints:
  regulatory: []
  accessibility: WCAG 2.1 AA — guías y tooltips de onboarding deben ser accesibles
  design_system:
    name: Design System Interno
    version: 2.4.1
    link: ""
  technical:
    - El sistema de activación debe operar sin cambios al backend de billing
    - Los tooltips y guías usan el framework de feature flags existente
    - El panel de valor calcula métricas en el cliente (sin nueva API de analytics)
decisions:
  - id: DEC-001
    date: 2026-06-02
    decision: Priorizar activación de funciones clave como palanca anti-churn por
      encima de reducción de precio
    rationale: F-007 muestra que usuarios con 3+ funciones activas tienen 67% menos
      churn. La palanca de precio requiere aprobación comercial fuera del scope actual.
      La activación de funciones es la intervención con mayor ROI esperado y menor
      costo de implementación.
    author: María González (CPO)
    supersedes: null
  - id: DEC-002
    date: 2026-06-10
    decision: "Selección de conceptos: C-001, C-002, C-003"
    rationale: C-001 (onboarding guiado) y C-002 (panel de valor) atacan la baja
      activación de funciones. C-003 (soporte en contexto) resuelve la fricción cuando
      el usuario se pierde. C-004 y C-005 descartados por alcance y complejidad de
      implementación fuera de timeline.
    author: Hugo Muñoz (Lead PM)
    supersedes: null
tasks:
  - id: H-001
    description: Si guiamos al usuario hacia las 3 funciones clave en los primeros
      7 días con un onboarding contextual, entonces aumentará la tasa de activación
      y reduciremos el churn temprano (F-002, F-007, F-010).
    stage: definicion
    owner: human
    status: todo
  - id: H-002
    description: Si mostramos el impacto real de cada función activada en un panel
      de valor, entonces el usuario percibirá mayor ROI del plan básico y reduciremos
      la sensación de 'no vale lo que pago' (F-004, F-008).
    stage: definicion
    owner: human
    status: todo
  - id: H-003
    description: Si ofrecemos soporte en contexto con sugerencias inteligentes al
      detectar comportamiento de confusión, entonces reduciremos la dependencia de
      tickets y el tiempo de espera percibido (F-003, F-006).
    stage: definicion
    owner: human
    status: todo
  - id: H-004
    description: Si mostramos al usuario su progreso de configuración y los pasos
      pendientes, entonces reduciremos la sensación de pérdida y aumentaremos la
      completitud del onboarding (F-005, F-006).
    stage: definicion
    owner: human
    status: todo
