intake:
  researchQuestion: ¿Por qué los usuarios abandonan el proceso de checkout antes
    de completar el pago?
  hypotheses:
    - Los usuarios abandonan el checkout porque el proceso tiene demasiados
      pasos o campos que generan fricción.
    - Una parte de las caídas se debe a errores técnicos o rechazos durante el
      procesamiento del pago.
    - Los usuarios desconfían del checkout por falta de señales de seguridad o
      claridad sobre los cargos finales.
    - La ausencia de métodos de pago preferidos por los usuarios provoca el
      abandono en el momento de pagar.
  productContext: Pagos es un producto de procesamiento de transacciones donde los
    usuarios completan compras a través de un flujo de checkout. La conversión
    en este flujo es crítica para el negocio.
  discoveryPlan:
    methods:
      - analitica
      - entrevistas
      - encuestas
      - soporte
      - benchmark
    instruments:
      - ces
      - csat
    expectedSourceKinds:
      - datos
      - entrevista
      - documento
